<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/icons/all.min.css">
</head>

<body>
    <div class="main">
        <div class="logo">M.Tamer <i class="fa-solid fa-signature pt-2"></i></div>
        <div class="body">
            <div class="show">
                <p></p>
            </div>
            <div class="buttons">
                <div class="button1">
                    <div class="button gray">AC</div>
                    <div class="button gray">+/-</div>
                    <div class="button gray">%</div>
                    <div class="button orange">/</div>
                </div>

                <div class="button1">
                    <div class="button dark">7</div>
                    <div class="button dark">8</div>
                    <div class="button dark">9</div>
                    <div class="button orange">*</div>
                </div>

                <div class="button1">
                    <div class="button dark">4</div>
                    <div class="button dark">5</div>
                    <div class="button dark">6</div>
                    <div class="button orange">-</div>
                </div>

                <div class="button1">
                    <div class="button dark">1</div>
                    <div class="button dark">2</div>
                    <div class="button dark">3</div>
                    <div class="button orange">+</div>
                </div>

                <div class="button1">
                    <div class="zero">0</div>
                    <div class="button dark">.</div>
                    <div class="button orange">=</div>
                </div>
                
            </div>
            
            
        </div>




    </div>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
